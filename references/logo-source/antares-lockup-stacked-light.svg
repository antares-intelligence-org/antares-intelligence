<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Host+Grotesk:ital,wght@0,300..800;1,300..800&amp;family=Space+Grotesk:wght@300..700&amp;display=swap');
      .font-antares-vt-light-trans { font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif; font-weight: 700; }
      .font-intel-vt-light-trans { font-family: 'Host Grotesk', system-ui, -apple-system, sans-serif; font-weight: 700; }
    </style>
    <linearGradient id="stRubyGlowLightTrans" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E56"/>
      <stop offset="50%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <radialGradient id="stStarCoreLightTrans" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF1F2"/>
      <stop offset="35%" stop-color="#FDA4AF"/>
      <stop offset="70%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#9F1239"/>
    </radialGradient>
    <filter id="stSubtleGlowLightTrans" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <g transform="translate(160, 68)">
    <path d="M 140 30 L 30 250 L 80 250 L 140 135 L 140 30 Z" fill="url(#stRubyGlowLightTrans)"/>
    <path d="M 140 30 L 140 135 L 200 250 L 250 250 L 140 30 Z" fill="url(#stRubyGlowLightTrans)" fill-opacity="0.88"/>
    <polygon points="80,180 200,180 176,220 104,220" fill="#FFFFFF" stroke="#E11D48" stroke-width="2" stroke-opacity="0.5"/>
    <circle cx="140" cy="200" r="22" fill="url(#stStarCoreLightTrans)" filter="url(#stSubtleGlowLightTrans)"/>
    <circle cx="140" cy="200" r="7" fill="#FFFFFF"/>
    <line x1="140" y1="168" x2="140" y2="176" stroke="#D97706" stroke-width="2" stroke-linecap="round"/>
    <line x1="140" y1="224" x2="140" y2="232" stroke="#D97706" stroke-width="2" stroke-linecap="round"/>
    <line x1="108" y1="200" x2="116" y2="200" stroke="#D97706" stroke-width="2" stroke-linecap="round"/>
    <line x1="164" y1="200" x2="172" y2="200" stroke="#D97706" stroke-width="2" stroke-linecap="round"/>
  </g>

  <g transform="translate(100, 396)">
    <text x="0" y="52" class="font-antares-vt-light-trans" font-size="62" fill="#0F172A" letter-spacing="5" textLength="400" lengthAdjust="spacing">ANTARES</text>
    <text x="0" y="96" class="font-intel-vt-light-trans" font-size="20" fill="#E11D48" textLength="400" lengthAdjust="spacing">INTELLIGENCE</text>
  </g>
</svg>
